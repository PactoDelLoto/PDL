<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría - Pacto del Loto</title>

    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <link rel="icon" type="image/png" href="/media/img/logo.ico" />
    <link href="/bootstrap-5.0.2/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/DataTables/datatables.min.css" rel="stylesheet" />
    <link href="/global.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        #auditoria-table .badge-section {
            font-size: 0.65rem;
        }
        #auditoria-table .badge-action {
            font-size: 0.6rem;
        }
        @media (max-width: 768px) {
            #auditoria-table_wrapper {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            #auditoria-table td, #auditoria-table th {
                white-space: nowrap;
            }
        }
    </style>
    <script src="/jquery-3.7.1.min.js"></script>
</head>

<body>
    <header></header>

    <main class="container mt-5 pt-5 mb-5">
        <div id="alert-container"></div>
        <div class="row">
            <div class="col">
                <h1 class="mb-2">Auditoría</h1>
                <p class="text-muted small mb-3">Registro de acciones realizadas en la web</p>
                <div class="d-flex flex-wrap gap-3 align-items-center mb-3">
                    <div class="d-flex align-items-center gap-2">
                        <label class="form-label mb-0 text-nowrap small" for="filter-audit-user">Usuario:</label>
                        <select id="filter-audit-user" class="form-select form-select-sm" style="width:auto;min-width:140px;">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <label class="form-label mb-0 text-nowrap small" for="filter-audit-section">Sección:</label>
                        <select id="filter-audit-section" class="form-select form-select-sm" style="width:auto;min-width:120px;">
                            <option value="">Todas</option>
                            <option value="usuarios">Usuarios</option>
                            <option value="eventos">Eventos</option>
                            <option value="torneos">Torneos</option>
                            <option value="inventario">Inventario</option>
                        </select>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <label class="form-label mb-0 text-nowrap small" for="filter-audit-action">Acción:</label>
                        <select id="filter-audit-action" class="form-select form-select-sm" style="width:auto;min-width:120px;">
                            <option value="">Todas</option>
                            <option value="crear">Crear</option>
                            <option value="editar">Editar</option>
                            <option value="eliminar">Eliminar</option>
                            <option value="desactivar">Desactivar</option>
                            <option value="reactivar">Reactivar</option>
                            <option value="iniciar">Iniciar</option>
                            <option value="finalizar">Finalizar</option>
                            <option value="cambio_rol">Cambio rol</option>
                        </select>
                    </div>
                    <button class="btn btn-danger btn-sm" id="btn-limpiar-auditoria">
                        <i class="fa-solid fa-trash-can me-1"></i>Eliminar más antiguas
                    </button>
                </div>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <table id="auditoria-table" class="table table-striped table-hover" style="width:100%">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Usuario</th>
                                    <th>Sección</th>
                                    <th>Acción</th>
                                    <th>Descripción</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer mt-auto py-3 bg-dark"></footer>

    <script src="/bootstrap-5.0.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="/DataTables/datatables.min.js"></script>
    <script src="/js/utils.js"></script>

    <script src="/controllers/firebase-config.js"></script>
    <script src="/controllers/authController.js"></script>
    <script src="/controllers/navigation.js"></script>
    <script src="/controllers/auditoriaController.js"></script>
</body>

</html>
