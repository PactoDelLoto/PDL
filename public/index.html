<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacto del Loto - Asociación Cultural</title>

    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <!-- Metadatos y Favicon -->
    <link rel="icon" type="image/png" href="/media/img/logo.ico" />

    <!-- Estilos CSS -->
    <link href="/bootstrap-5.0.2/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/global.css" rel="stylesheet" />

    <!-- Fuentes Externas -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="/jquery-3.7.1.min.js"></script>
</head><body>

    <header>
        <!-- El navbar se cargará aquí -->
    </header>

    <!-- Carrusel PDL -->
    <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active" data-titulo="Pacto del Loto" data-texto="Asociación gaditana de juegos de cartas TCG, miniaturas y Rol">
                <img class="d-block w-100" src="/media/img/carrusel1.jpg" alt="Pacto del Loto">
            </div>
            <div class="carousel-item" data-titulo="Pacto del Loto" data-texto="Asociación gaditana de juegos de cartas TCG, miniaturas y Rol">
                <img class="d-block w-100" src="/media/img/carrusel2.jpg" alt="Pacto del Loto">
            </div>
            <div class="carousel-item" data-titulo="Pacto del Loto" data-texto="Asociación gaditana de juegos de cartas TCG, miniaturas y Rol">
                <img class="d-block w-100" src="/media/img/carrusel3.jpg" alt="Pacto del Loto">
            </div>
        </div>
        <div class="din-caption" id="carrusel-caption">
            <div class="caption-box">
                <div class="caption-texto">
                    <h2 class="fw-bold display-5" id="carrusel-caption-titulo"></h2>
                    <p class="lead mt-2 mb-0" id="carrusel-caption-texto"></p>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
        </button>
    </div>

    <footer class="footer mt-auto py-3 bg-dark">
        <!-- El footer se cargará aquí -->
    </footer>

    <!-- Scripts de Bootstrap y Firebase -->
    <script src="/bootstrap-5.0.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Controladores de la aplicación -->
    <script src="/controllers/firebase-config.js"></script>
    
    <!-- FICHERO PRINCIPAL (Debe cargarse antes que los controladores específicos) -->
    <script src="/js/main.js"></script>

    <script src="/controllers/authController.js"></script>
    <script src="/controllers/navigation.js"></script>
    <script src="/js/contenidoRenderer.js"></script>

    <script>
        if (window.contenidoRenderer) {
            contenidoRenderer.setupCarruselCaptions();
            contenidoRenderer.cargarCarrusel();
        }
    </script>
