<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Pacto del Loto</title>

    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <link rel="icon" type="image/png" href="/media/img/logo.ico" />
    <link href="/bootstrap-5.0.2/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/DataTables/datatables.min.css" rel="stylesheet" />
    <link href="/global.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="/jquery-3.7.1.min.js"></script>

    <style>
        #messages-table th { white-space: nowrap; }
        #messages-table tr { cursor: pointer; }
        #admin-pane { width: 100%; }
    </style>
</head>
<body>
    <header></header>

    <main class="container mt-5 pt-5 mb-5">
        <div id="alert-container" class="position-fixed top-0 end-0 p-3" style="z-index: 1055"></div>

        <div class="row justify-content-center">
            <div class="col-12">
                <h1 class="mb-4">Contacto</h1>

                <ul class="nav nav-tabs mb-4" id="contactTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="send-tab" data-bs-toggle="tab" data-bs-target="#send-pane" type="button" role="tab">
                            <i class="fa-solid fa-paper-plane me-1"></i>Enviar mensaje
                        </button>
                    </li>
                    <li class="nav-item" role="presentation" id="admin-tab-li" style="display:none;">
                        <button class="nav-link" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin-pane" type="button" role="tab">
                            <i class="fa-solid fa-inbox me-1"></i>Bandeja de entrada
                        </button>
                    </li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="send-pane" role="tabpanel">
                        <div class="row justify-content-center">
                            <div class="col-lg-8">
                                <div class="card shadow-sm">
                            <div class="card-body">
                                <p class="text-muted mb-3">¿Tienes alguna duda, sugerencia o quieres ponerte en contacto con nosotros? Rellena el formulario y te responderemos lo antes posible.</p>
                                <form id="contact-form">
                                    <div class="mb-3">
                                        <label for="contact-name" class="form-label">Nombre</label>
                                        <input type="text" class="form-control" id="contact-name" required maxlength="100">
                                    </div>
                                    <div class="mb-3">
                                        <label for="contact-email" class="form-label">Correo electrónico</label>
                                        <input type="email" class="form-control" id="contact-email" required maxlength="200">
                                    </div>
                                    <div class="mb-3">
                                        <label for="contact-message" class="form-label">Mensaje</label>
                                        <textarea class="form-control" id="contact-message" rows="5" required maxlength="5000"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary" id="contact-submit-btn">
                                        <i class="fa-solid fa-paper-plane me-1"></i>Enviar
                                    </button>
                                </form>
                                <div id="contact-success" class="alert alert-success d-none mt-3 mb-0">
                                    <i class="fa-solid fa-check-circle me-1"></i>Mensaje enviado correctamente. Gracias por contactar con nosotros.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

                    <div class="tab-pane fade" id="admin-pane" role="tabpanel">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h5 class="mb-0">Mensajes recibidos</h5>
                                    <div class="form-check form-switch mb-0">
                                        <input class="form-check-input" type="checkbox" id="show-read-messages">
                                        <label class="form-check-label small" for="show-read-messages">Mostrar leídos</label>
                                    </div>
                                </div>
                                <div class="table-wrap">
                                    <table id="messages-table" class="table table-striped table-hover" style="width:100%">
                                        <thead>
                                            <tr>
                                                <th>Fecha</th>
                                                <th>Nombre</th>
                                                <th>Correo</th>
                                                <th>Estado</th>
                                                <th>Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Ver Mensaje -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Mensaje de <span id="modal-name"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-1"><strong>Correo:</strong> <span id="modal-email"></span></p>
                    <p class="mb-1"><strong>Fecha:</strong> <span id="modal-date"></span></p>
                    <hr>
                    <p id="modal-message" style="white-space: pre-wrap;"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-danger" id="modal-delete-btn"><i class="fa-solid fa-trash me-1"></i>Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-auto py-3 bg-dark"></footer>

    <script src="/bootstrap-5.0.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="/DataTables/datatables.min.js"></script>
    <script src="/js/utils.js"></script>

    <script src="/controllers/firebase-config.js"></script>
    <script src="/controllers/authController.js"></script>
    <script src="/controllers/navigation.js"></script>
    <script src="/controllers/contactoController.js"></script>
</body>
</html>
