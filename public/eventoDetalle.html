<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Evento - Pacto del Loto</title>

    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <!-- Open Graph -->
    <meta property="og:title" content="Pacto del Loto">
    <meta property="og:description" content="Asociación de juegos de mesa y rol">
    <meta property="og:image" content="/media/img/logo.png">
    <meta property="og:url" content="">
    <meta property="og:type" content="website">

    <!-- Metadatos y Favicon -->
    <link rel="icon" type="image/png" href="/media/img/logo.ico" />

    <!-- Estilos CSS -->
    <link href="/bootstrap-5.0.2/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/DataTables/datatables.min.css" rel="stylesheet" />
    <link href="/global.css" rel="stylesheet" />

    <!-- Fuentes Externas -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

    <header>
        <!-- El navbar se cargará aquí -->
    </header>

    <main class="container mt-5 pt-5">
        <!-- Botón para volver a la lista de eventos -->
        <div class="mb-4 d-flex justify-content-between align-items-center">
            <a href="/eventos.html" class="btn btn-outline-secondary"><i class="fas fa-arrow-left"></i> Volver a
                Eventos</a>
        </div>

        <!-- Contenedor de Detalles del Evento -->
        <div class="card shadow-lg mb-5">
            <img id="event-detail-image" src="" class="card-img-top" alt="Imagen del evento"
                style="max-height: 400px; object-fit: cover;">
            <div class="card-body p-4">
                <h1 id="event-detail-title" class="card-title display-5 fw-bold mb-3">Cargando...</h1>
                <p id="event-detail-description" class="card-text fs-5 mb-4">Cargando descripción...</p>

                <div class="d-flex justify-content-between text-muted">
                    <span id="event-detail-date"><i class="fas fa-calendar-alt"></i> Cargando fecha...</span>
                    <span id="event-detail-place"><i class="fas fa-map-marker-alt"></i> Cargando lugar...</span>
                </div>
            </div>
        </div>

        <!-- Tabs: Actividades y Resultados de Liga -->
        <div class="mt-5 mb-5">
            <ul class="nav nav-tabs" id="eventTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="actividades-tab-btn" data-bs-toggle="tab"
                        data-bs-target="#actividades-tab-pane" type="button" role="tab">Actividades</button>
                </li>
                <li class="nav-item" role="presentation" id="liga-tab-li" style="display:none;">
                    <button class="nav-link" id="liga-tab-btn" data-bs-toggle="tab"
                        data-bs-target="#liga-tab-pane" type="button" role="tab">Resultados de Liga</button>
                </li>
            </ul>
            <div class="tab-content">
                <!-- Panel Actividades -->
                <div class="tab-pane fade show active" id="actividades-tab-pane" role="tabpanel">
                    <div class="d-flex justify-content-between align-items-center mt-3 mb-4">
                        <h2>Actividades</h2>
                        <button id="create-subevent-btn" class="btn btn-primary colaborador-controls" style="display: none;">
                            <i class="fas fa-plus"></i> Crear Actividad
                        </button>
                    </div>
                    <div class="d-flex gap-3 mb-3">
                        <div class="form-check admin-controls" style="display:none;">
                            <input class="form-check-input" type="checkbox" id="show-past-subevents">
                            <label class="form-check-label" for="show-past-subevents">
                                Mostrar actividades pasadas
                            </label>
                        </div>
                        <div class="form-check colaborador-controls" style="display:none;">
                            <input class="form-check-input" type="checkbox" id="show-unpublished-subevents">
                            <label class="form-check-label" for="show-unpublished-subevents">
                                Mostrar no publicadas
                            </label>
                        </div>
                    </div>
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table id="subeventos-table" class="table table-striped table-hover" width="100%">
                                    <!-- Cabecera y cuerpo serán gestionados por DataTables -->
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Panel Resultados de Liga -->
                <div class="tab-pane fade" id="liga-tab-pane" role="tabpanel">
                    <div class="mt-3 mb-4">
                        <h2>Resultados de Liga</h2>
                    </div>
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover" width="100%">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>#</th>
                                            <th>Nombre</th>
                                            <th class="text-center">Código</th>
                                            <th class="text-center">Puntos</th>
                                        </tr>
                                    </thead>
                                    <tbody id="liga-standings-tbody">
                                        <tr><td colspan="4" class="text-center text-muted py-4">Cargando clasificación...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Modal de Confirmación -->
    <div class="modal fade" id="confirmation-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Confirmar acción</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body" id="confirmation-modal-body-text">
                    ¿Estás seguro?
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>
                    <button class="btn btn-danger" id="confirm-action-btn">
                        Eliminar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal para Crear/Editar Actividad -->
    <div class="modal fade" id="subevent-modal" tabindex="-1" aria-labelledby="subevent-modal-title" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="subevent-modal-title">Crear Nueva Actividad</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="subevent-form">
                        <input type="hidden" id="subevent-id">

                        <div class="mb-3">
                            <label class="form-label">Título de la Actividad</label>
                            <input type="text" class="form-control" id="subevent-titulo" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" id="subevent-descripcion" rows="3" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tipo de Actividad</label>
                                <select id="subevent-tipo" class="form-select" required>
                                    <option value="" disabled selected>Seleccione un tipo...</option>
                                    <!-- Los tipos se cargarán aquí desde la DB -->
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Plazas Disponibles</label>
                                <input type="number" class="form-control" id="subevent-plazas" min="0" value="0"
                                    required>
                                <div class="form-text">Si es 0, se considerará "Entrada libre".</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Fecha de la Actividad</label>
                                <input type="date" class="form-control" id="subevent-fechaEvento">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Hora de la Actividad</label>
                                <input type="time" class="form-control" id="subevent-horaEvento">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Lugar</label>
                            <input type="text" class="form-control" id="subevent-lugar" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Fecha de Publicación</label>
                            <input type="datetime-local" class="form-control" id="subevent-fechaPublicacion" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">URL de Imagen (opcional)</label>
                            <input type="text" class="form-control" id="subevent-imagen">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">URL de bases (opcional)</label>
                            <input type="url" class="form-control" id="subevent-bases-url" placeholder="https://...">
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="subevent-incluir-inscripcion">
                            <label class="form-check-label" for="subevent-incluir-inscripcion">
                                ¿Incluir formulario de inscripción?
                            </label>
                        </div>

                        <div id="subevent-pago-previo-container" style="display:none;">
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="subevent-pago-previo">
                                <label class="form-check-label" for="subevent-pago-previo">
                                    Pago previo al evento
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" form="subevent-form" id="save-subevent-btn">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenedor de Alertas -->
    <div id="alert-container" class="position-fixed top-0 end-0 p-3" style="z-index:1055"></div>

    <footer class="footer mt-auto py-3 bg-dark"></footer>

    <!-- Scripts -->
    <script src="/jquery-3.7.1.min.js"></script>
    <script src="/bootstrap-5.0.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script src="/controllers/firebase-config.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/controllers/authController.js"></script>
    <script src="/controllers/navigation.js"></script>
    <script src="/controllers/subeventosController.js"></script>
    <script src="/controllers/eventosController.js"></script>

    <script src="/DataTables/datatables.min.js"></script>
</body>

</html>
