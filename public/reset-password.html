<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Pacto del Loto</title>

    <!-- Metadatos y Favicon -->
    <link rel="icon" type="image/png" href="/media/img/logo.ico" />

    <!-- Estilos CSS -->
    <link href="/bootstrap-5.0.2/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/global.css" rel="stylesheet" />

    <!-- Fuentes Externas -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />

    <script src="/jquery-3.7.1.min.js"></script>
</head>
<body>
    <header>
        <!-- El navbar se cargará aquí -->
    </header>

    <main class="container mt-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="card-title text-center mb-4">Restablecer Contraseña</h2>
                        <p class="text-center text-muted mb-4">Introduce tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
                        <form id="reset-password-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <!-- Contenedor para mostrar mensajes de éxito o error -->
                            <div id="feedback-message" class="mt-3"></div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary">Enviar Enlace</button>
                            </div>
                        </form>
                        <div class="text-center mt-4">
                            <p><a href="/login.html">Volver a Iniciar Sesión</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer mt-auto py-3 bg-dark">
        <!-- El footer se cargará aquí -->
    </footer>

    <!-- Scripts -->
    <script src="/bootstrap-5.0.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="/controllers/firebase-config.js"></script>
    <script src="/controllers/authController.js"></script>
    <script src="/controllers/navigation.js"></script>
    <script src="/controllers/resetPasswordController.js"></script>
</body>
</html>
