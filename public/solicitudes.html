<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes - Pacto del Loto</title>
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <link rel="icon" type="image/png" href="/media/img/logo.ico" />
    <link href="/bootstrap-5.0.2/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/DataTables/datatables.min.css" rel="stylesheet" />
    <link href="/global.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="/jquery-3.7.1.min.js"></script>
</head>
<body>
    <header></header>

    <main class="container mt-5 pt-5 mb-5">
        <div id="alert-container"></div>
        <div id="solicitudes-section" class="row">
            <div class="col">
                <h1 class="mb-4">Solicitudes</h1>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">Bandeja de solicitudes</h5>
                            <div class="d-flex gap-2 align-items-center">
                                <select id="filter-solicitud-tipo" class="form-select form-select-sm" style="width:auto;">
                                    <option value="">Todos los tipos</option>
                                    <option value="ser_socio">Ser socio</option>
                                    <option value="actualizar_cuentas">Actualizar cuentas</option>
                                    <option value="inscripcion_actividad">Inscripción actividad</option>
                                </select>
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox" id="show-read-solicitudes">
                                    <label class="form-check-label small" for="show-read-solicitudes">Mostrar leídos</label>
                                </div>
                            </div>
                        </div>
                        <table id="solicitudes-table" class="table table-striped table-hover" style="width:100%">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Usuario</th>
                                    <th>Tipo</th>
                                    <th>Mensaje</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal para ver/responder solicitud -->
    <div class="modal fade" id="solicitud-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Solicitud de <span id="solicitud-modal-user"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-1"><strong>Fecha:</strong> <span id="solicitud-modal-fecha"></span></p>
                    <p class="mb-1"><strong>Tipo:</strong> <span id="solicitud-modal-tipo"></span></p>
                    <hr>
                    <div class="conversacion-scroll" style="max-height: 40vh; overflow-y: auto;" id="solicitud-conversacion">
                    </div>
                    <hr>
                    <div class="mb-3">
                        <label for="solicitud-respuesta-input" class="form-label"><strong>Responder</strong></label>
                        <textarea class="form-control" id="solicitud-respuesta-input" rows="3" placeholder="Escribe tu respuesta..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" id="solicitud-enviar-respuesta-btn">
                        <i class="fa-solid fa-reply me-1"></i>Enviar respuesta
                    </button>
                    <button type="button" class="btn btn-danger" id="solicitud-eliminar-btn">
                        <i class="fa-solid fa-trash me-1"></i>Eliminar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación -->
    <div class="modal fade" id="confirmation-modal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmationModalLabel">Confirmar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p id="confirmation-modal-body-text">¿Estás seguro de que quieres realizar esta acción?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="confirm-action-btn">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-auto py-3 bg-dark"></footer>

    <script src="/bootstrap-5.0.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="/DataTables/datatables.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/controllers/firebase-config.js"></script>
    <script src="/controllers/authController.js"></script>
    <script src="/controllers/navigation.js"></script>
    <script src="/controllers/solicitudesController.js"></script>
</body>
</html>
