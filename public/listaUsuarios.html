<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Usuarios - Pacto del Loto</title>

    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <!-- Metadatos y Favicon -->
    <link rel="icon" type="image/png" href="/media/img/logo.ico" />

    <!-- Estilos CSS -->
    <link href="/bootstrap-5.0.2/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/DataTables/datatables.min.css" rel="stylesheet" />
    <link href="/global.css" rel="stylesheet" />

    <!-- Fuentes Externas -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        #usuarios-table .user-pagado-hasta {
            min-width: 75px;
        }

        #usuarios-table .dropdown-toggle::after {
            display: none;
        }

        @media (max-width: 768px) {
            #usuarios-table_wrapper {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            #usuarios-table td, #usuarios-table th {
                white-space: nowrap;
            }
        }
    </style>
    <!-- Script para cargar componentes comunes -->
    <script src="/jquery-3.7.1.min.js"></script>
</head>

<body>
    <header>
        <!-- El navbar se cargará aquí -->
    </header>

    <main class="container mt-5 pt-5 mb-5">
        <div id="alert-container"></div>
        <div class="row">
            <div class="col">
                <h1 class="mb-4">Listado de Usuarios</h1>
                <div class="d-flex flex-wrap gap-3 align-items-center mb-3">
                    <div class="d-flex align-items-center gap-2">
                        <label class="form-label mb-0 text-nowrap" for="filter-rol">Ver solo:</label>
                            <select id="filter-rol" class="form-select form-select-sm" style="width:auto">
                                <option value="">Todos</option>
                                <option value="admin">Admins</option>
                                <option value="colaborador">Colaboradores</option>
                                <option value="socio">Socios</option>
                                <option value="noSocio">No socios</option>
                            </select>
                    </div>
                    <div id="filter-estado-pago-container" class="d-flex align-items-center gap-2 d-none">
                        <label class="form-label mb-0 text-nowrap">Estado de pago:</label>
                        <div class="dropdown">
                            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" id="filter-estado-pago-btn" style="min-width:145px;text-align:left;">
                                Todos
                            </button>
                            <ul class="dropdown-menu" id="filter-estado-pago-menu" style="min-width:145px;">
                                <li><button class="dropdown-item" data-value="">Todos</button></li>
                                <li><button class="dropdown-item" data-value="debe1"><i class="fa-solid fa-triangle-exclamation text-warning me-1"></i>Debe 1 mes</button></li>
                                <li><button class="dropdown-item" data-value="debe2"><i class="fa-solid fa-triangle-exclamation text-danger me-1"></i>Debe 2 meses</button></li>
                            </ul>
                        </div>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="filter-proximos-deuda">
                        <label class="form-check-label" for="filter-proximos-deuda">Próximos a deuda</label>
                    </div>
                    <button class="btn btn-primary btn-sm" id="btn-actualizar-cuentas">
                        <i class="fa-solid fa-rotate me-1"></i>Actualizar Cuentas
                    </button>
                    <button class="btn btn-success btn-sm" id="btn-exportar-csv">
                        <i class="fa-solid fa-file-csv me-1"></i>Exportar CSV
                    </button>
                </div>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <table id="usuarios-table" class="table table-striped table-hover" style="width:100%">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Rol</th>
                                    <th>Al corriente</th>
                                    <th>Pagado hasta</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Los datos se cargarán aquí dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal para Editar Usuario -->
    <div class="modal fade" id="edit-user-modal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editUserModalLabel">Editar Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="edit-user-form">
                    <div class="modal-body">
                        <input type="hidden" id="edit-user-id">
                        <div class="mb-2">
                            <label for="edit-user-name" class="form-label">Nombre</label>
                            <input type="text" class="form-control form-control-sm" id="edit-user-name" required>
                        </div>
                        <div class="mb-2">
                            <label for="edit-user-lastname" class="form-label">Apellidos</label>
                            <input type="text" class="form-control form-control-sm" id="edit-user-lastname" required>
                        </div>
                        <div class="mb-2">
                            <label for="edit-user-phone" class="form-label">Teléfono</label>
                            <input type="text" class="form-control form-control-sm" id="edit-user-phone">
                        </div>
                        <hr class="my-2">
                        <label class="form-label mb-1">Roles</label>
                        <div class="d-flex gap-3">
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="edit-user-socio">
                                <label class="form-check-label" for="edit-user-socio">Socio</label>
                            </div>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="edit-user-colaborador">
                                <label class="form-check-label" for="edit-user-colaborador">Colaborador</label>
                            </div>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="edit-user-admin">
                                <label class="form-check-label" for="edit-user-admin">Admin</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmación Genérico -->
    <div class="modal fade" id="confirmation-modal" tabindex="-1" aria-labelledby="confirmationModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmationModalLabel">Confirmar Acción</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="confirmation-modal-body-text">¿Estás seguro de que quieres realizar esta acción?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="confirm-action-btn">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-auto py-3 bg-dark">
        <!-- El footer se cargará aquí -->
    </footer>

    <!-- Scripts -->
    <script src="/bootstrap-5.0.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="/DataTables/datatables.min.js"></script>
    <script src="/js/utils.js"></script>

    <!-- Controladores de la aplicación -->
    <script src="/controllers/firebase-config.js"></script>
    <script src="/controllers/authController.js"></script>
    <script src="/controllers/navigation.js"></script>
    <script src="/controllers/UsuariosController.js"></script>
</body>

</html>
